[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-socks5"
version = "2.2.0"
description = "A Python SOCKS Protocol Version 5 proxy server"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
# Ruff and mypy are pinned exactly so local runs and CI lint, format and type-check identically; bump them on purpose.
# py-spy samples the proxy's threads for benchmarks/ (python -m benchmarks --profile py-spy).
dev = ["ruff==0.16.10", "mypy==2.4.0", "pytest", "pytest-cov", "py-spy"]

[project.scripts]
simple-socks5 = "simple_socks5.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The benchmark harness smoke test is slow and only checks it runs: pytest -m bench
addopts = ["-m", "not bench"]
markers = ["bench: runs the benchmark harness in benchmarks/ with tiny sizes"]

[tool.mypy]
files = ["src", "tests", "benchmarks"]
mypy_path = "src"
python_version = "3.10"
strict = true
warn_unreachable = true
extra_checks = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined", "redundant-self", "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "simple_socks5.*"
disallow_any_explicit = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "BLE", "S", "PT", "RET", "ARG", "N", "PL",
    "TRY", "PERF", "PIE", "T20", "T10", "ERA", "LOG", "G", "PGH", "A",
]
ignore = [
    "TRY003",  # a ValueError carrying its message is the idiomatic way to report bad configuration
    "TRY400",  # expected errors are logged without a traceback on purpose (exc_info=False)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",                  # pytest asserts
    "PLR2004",               # expected values in assertions are the point of a test
    "S104",                  # tests exercise bind-all ("0.0.0.0") handling
    "S105", "S106", "S107",  # fixed fake credentials
]
"benchmarks/**" = [
    "T201",          # a command-line tool that prints its results
    "S603", "S607",  # starts the proxy, origins, py-spy and git as subprocesses by design
    "PLR2004",       # sizes and counts are spelled out where they are used
    "S101",          # asserts narrow types for mypy
]
