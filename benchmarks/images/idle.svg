<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="16.0" y="26.0" fill="#0b0b0b" font-size="15" font-weight="600">idle</text><text x="16.0" y="46.0" fill="#52514e">Memory and threads for established connections that carry no data.</text><text x="16.0" y="76.0" fill="#0b0b0b" font-weight="600">100 idle connections: RSS KiB/conn, lower is better</text><text x="112.0" y="98.0" fill="#0b0b0b" text-anchor="end">proxy</text><path d="M120.0,86.0h436.0a4.0,4.0 0 0 1 4.0,4.0v8.0a4.0,4.0 0 0 1 -4.0,4.0h-436.0z" fill="#2a78d6"/><text x="566.0" y="98.0" fill="#0b0b0b">52.7 KiB/conn</text><text x="16.0" y="132.0" fill="#0b0b0b" font-weight="600">1000 idle connections: RSS KiB/conn, lower is better</text><text x="112.0" y="154.0" fill="#0b0b0b" text-anchor="end">proxy</text><path d="M120.0,142.0h436.0a4.0,4.0 0 0 1 4.0,4.0v8.0a4.0,4.0 0 0 1 -4.0,4.0h-436.0z" fill="#2a78d6"/><text x="566.0" y="154.0" fill="#0b0b0b">54.1 KiB/conn</text><text x="16.0" y="184.0" fill="#898781">Bars are scaled per case. ×N is how many times better than the default proxy.</text></svg>
