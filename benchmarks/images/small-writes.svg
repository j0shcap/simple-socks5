<svg xmlns="http://www.w3.org/2000/svg" width="760" height="188" viewBox="0 0 760 188" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="16.0" y="26.0" fill="#0b0b0b" font-size="15" font-weight="600">small-writes</text><text x="16.0" y="46.0" fill="#52514e">Request/response round trips over one connection where each message is written in two parts, which is where</text><text x="16.0" y="76.0" fill="#0b0b0b" font-weight="600">300 x 512 B in 2 writes: p50 ms, lower is better</text><text x="112.0" y="98.0" fill="#0b0b0b" text-anchor="end">direct</text><path d="M120.0,86.0h3.8a3.8,3.8 0 0 1 3.8,3.8v8.3a3.8,3.8 0 0 1 -3.8,3.8h-3.8z" fill="#898781"/><text x="133.7" y="98.0" fill="#0b0b0b">1.48 ms</text><text x="189.9" y="98.0" fill="#52514e">×57.5 vs proxy</text><text x="112.0" y="122.0" fill="#0b0b0b" text-anchor="end">proxy</text><path d="M120.0,110.0h436.0a4.0,4.0 0 0 1 4.0,4.0v8.0a4.0,4.0 0 0 1 -4.0,4.0h-436.0z" fill="#2a78d6"/><text x="566.0" y="122.0" fill="#0b0b0b">85.0 ms</text><text x="112.0" y="146.0" fill="#0b0b0b" text-anchor="end">proxy+nodelay</text><path d="M120.0,134.0h4.3a4.0,4.0 0 0 1 4.0,4.0v8.0a4.0,4.0 0 0 1 -4.0,4.0h-4.3z" fill="#eb6834"/><text x="134.3" y="146.0" fill="#0b0b0b">1.60 ms</text><text x="190.5" y="146.0" fill="#52514e">×53.2 vs proxy</text><text x="16.0" y="176.0" fill="#898781">Bars are scaled per case. ×N is how many times better than the default proxy.</text></svg>
